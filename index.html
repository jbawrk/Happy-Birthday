<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Zyra!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #FFD1E8 0%, #FFE8CC 45%, #FFF6D9 100%);
    font-family: 'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif;
  }
 
  .sky {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
 
  /* Twinkling stars */
  .star {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.8;
    animation: twinkle 2.2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
 
  /* Balloons */
  .balloon {
    position: absolute;
    bottom: -120px;
    width: 46px;
    height: 58px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    animation: floatUp linear infinite;
    opacity: 0.9;
  }
  .balloon::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 60px;
    background: rgba(255,255,255,0.6);
    transform: translateX(-50%);
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(-60vh) translateX(20px) rotate(4deg); }
    100% { transform: translateY(-130vh) translateX(-10px) rotate(-4deg); }
  }
 
  .title-wrap {
    position: absolute;
    top: 6%;
    width: 100%;
    text-align: center;
    z-index: 5;
  }
  .title-wrap h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 84px);
    color: #C2185B;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(255,182,193,0.6);
    animation: pop 1.6s ease-in-out infinite;
  }
  .title-wrap h2 {
    margin: 8px 0 0;
    font-size: clamp(28px, 6vw, 52px);
    color: #7E57C2;
    text-shadow: 2px 2px 0 #fff;
  }
  @keyframes pop {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    50% { transform: scale(1.06) rotate(1deg); }
  }
 
  /* Fairy scene */
  .fairy-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: flyAround 14s ease-in-out infinite, bob 1.4s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes flyAround {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); }
    12%  { transform: translate(-50%, -50%) translate(-30vw, -12vh) rotate(-6deg) scale(0.92); }
    25%  { transform: translate(-50%, -50%) translate(-36vw, 9vh) rotate(-3deg) scale(0.88); }
    37%  { transform: translate(-50%, -50%) translate(-13vw, 24vh) rotate(5deg) scale(0.98); }
    50%  { transform: translate(-50%, -50%) translate(16vw, 22vh) rotate(8deg) scale(0.9); }
    62%  { transform: translate(-50%, -50%) translate(33vw, 5vh) rotate(5deg) scale(0.88); }
    75%  { transform: translate(-50%, -50%) translate(28vw, -20vh) rotate(-5deg) scale(0.95); }
    87%  { transform: translate(-50%, -50%) translate(5vw, -26vh) rotate(-3deg) scale(1); }
    100% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); }
  }
  @keyframes bob {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -14px; }
  }
 
  .sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #FFF176;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: sparkleFade 1.4s ease-in-out infinite;
  }
  @keyframes sparkleFade {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(90deg); }
  }
 
  .wing {
    position: absolute;
    width: 110px;
    height: 150px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(179,157,219,0.6) 65%, rgba(179,157,219,0.25));
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 60% 40% 60% 40%;
    top: 175px;
    z-index: 1;
    transform-origin: top center;
  }
  .wing-left {
    left: -95px;
    animation: flapLeft 0.5s ease-in-out infinite;
  }
  .wing-right {
    right: -95px;
    border-radius: 40% 60% 40% 60%;
    animation: flapRight 0.5s ease-in-out infinite;
  }
  @keyframes flapLeft {
    0%, 100% { transform: rotate(-15deg) scaleX(1); }
    50% { transform: rotate(5deg) scaleX(0.85); }
  }
  @keyframes flapRight {
    0%, 100% { transform: rotate(15deg) scaleX(1); }
    50% { transform: rotate(-5deg) scaleX(0.85); }
  }
 
  .body-small {
    position: absolute;
    top: 218px;
    left: 50%;
    transform: translateX(-50%);
    width: 92px;
    height: 108px;
    background: linear-gradient(180deg, #F0177E, #D6006B);
    border: 3px solid #1A1A1A;
    border-radius: 50% 50% 40% 40%;
    box-shadow: inset -8px -6px 14px rgba(0,0,0,0.1);
    z-index: 2;
  }
  .body-small::before,
  .body-small::after {
    content: '';
    position: absolute;
    bottom: -10px;
    width: 24px;
    height: 40px;
    background: #E0A470;
    border-radius: 40%;
  }
  .body-small::before { left: 12px; transform: rotate(8deg); }
  .body-small::after { right: 12px; transform: rotate(-8deg); }
 
  .arm {
    position: absolute;
    top: 230px;
    width: 18px;
    height: 52px;
    background: #E0A470;
    border-radius: 10px;
    animation: wave 1.2s ease-in-out infinite;
    transform-origin: top center;
  }
  .arm-left { left: 50%; margin-left: -70px; animation-delay: 0.1s; }
  .arm-right { left: 50%; margin-left: 52px; }
  @keyframes wave {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-25deg); }
  }
 
  .wand {
    position: absolute;
    top: 218px;
    left: 50%;
    margin-left: 62px;
    width: 5px;
    height: 60px;
    background: #FFD54F;
    border-radius: 4px;
    transform: rotate(-20deg);
    transform-origin: bottom center;
    animation: wandWave 1.2s ease-in-out infinite;
  }
  .wand::before {
    content: '';
    position: absolute;
    top: -18px;
    left: -12px;
    width: 28px;
    height: 28px;
    background: #FFF176;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  @keyframes wandWave {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(-55deg); }
  }
 
  .head-photo {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    overflow: hidden;
    background: transparent;
    z-index: 3;
    border: 4px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .head-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
 
  .hair, .hair-side-l, .hair-side-r {
    display: none;
  }
 
  .face {
    display: none;
  }
 
  .crown {
    position: absolute;
    top: -48px;
    left: 50%;
    transform: translateX(-50%);
    width: 88px;
    height: 38px;
    z-index: 4;
  }
  .crown::before {
    content: '';
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 24px;
    background: #FFD54F;
    clip-path: polygon(0% 100%, 0% 40%, 20% 100%, 30% 20%, 50% 100%, 70% 20%, 80% 100%, 100% 40%, 100% 100%);
  }
  .crown-gem {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #E91E63;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
 
  .tutu {
    position: absolute;
    top: 258px;
    left: 50%;
    transform: translateX(-50%);
    width: 132px;
    height: 44px;
    background: repeating-linear-gradient(90deg, #F0177E, #F0177E 11px, #1A1A1A 11px, #1A1A1A 15px);
    border-radius: 50% 50% 60% 60%;
    z-index: 2;
    animation: tutuSway 1.6s ease-in-out infinite;
    transform-origin: top center;
  }
  @keyframes tutuSway {
    0%, 100% { transform: translateX(-50%) rotate(-3deg); }
    50% { transform: translateX(-50%) rotate(3deg); }
  }
 
  .subtext {
    display: none;
  }
 
  .confetti {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    animation: confettiFall linear infinite;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }
 
  /* Age badge */
  .age-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFF3B0, #FFD54F 55%, #FFB300 100%);
    box-shadow: 0 0 0 6px rgba(255,213,79,0.25), 0 0 30px rgba(255,179,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    animation: badgePulse 2.4s ease-in-out infinite;
  }
  .age-badge span {
    font-size: 64px;
    font-weight: bold;
    color: #C2185B;
    text-shadow: 2px 2px 0 #fff;
  }
  @keyframes badgePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
  }
 
  /* Cakes */
  .cake {
    position: absolute;
    bottom: -140px;
    width: 46px;
    animation: floatUp linear infinite;
    opacity: 0.95;
  }
  .cake-candle {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: #FFD54F;
  }
  .cake-flame {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 9px;
    background: #FF8A65;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(0.8) rotate(4deg); }
  }
  .cake-top {
    width: 30px;
    height: 16px;
    margin: 0 auto;
    background: #FFF6E0;
    border: 2px solid #1A1A1A;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .cake-bottom {
    width: 46px;
    height: 20px;
    background: #F0177E;
    border: 2px solid #1A1A1A;
    border-radius: 4px;
  }
 
  /* Dragons */
  .dragon {
    position: absolute;
    width: 240px;
    height: 100px;
    animation: dragonDrift linear infinite;
  }
  .dragon svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .dragon-wiggle {
    animation: dragonWiggle 1.4s ease-in-out infinite;
    transform-origin: 175px 30px;
  }
  @keyframes dragonWiggle {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes dragonDrift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(-22vw, -14vh) rotate(4deg); }
    50%  { transform: translate(-42vw, 8vh) rotate(-4deg); }
    75%  { transform: translate(-18vw, 20vh) rotate(3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
 
  /* Pink fairy dust trail canvas */
  #dustCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
  }
</style>
</head>
<body>
<div class="sky" id="sky">
  <canvas id="dustCanvas"></canvas>
 
  <div class="title-wrap">
    <h1>Happy Birthday</h1>
    <h2>Zyra!</h2>
  </div>
 
  <div class="age-badge"><span>27</span></div>
 
  <div class="fairy-stage">
    <div class="crown">
      <div class="crown-gem"></div>
    </div>
    <div class="wing wing-left"></div>
    <div class="wing wing-right"></div>
    <div class="head-photo">
      <img src="zyra-head.png" alt="Zyra" onerror="this.style.display='none'; this.parentElement.style.background='rgba(255,255,255,0.15)';">
    </div>
    <div class="face"></div>
    <div class="body-small"></div>
    <div class="tutu"></div>
    <div class="arm arm-left"></div>
    <div class="arm arm-right"></div>
    <div class="wand"></div>
  </div>
  </div>
 
<script>
  const sky = document.getElementById('sky');
 
  // Stars
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 2 + 's';
    sky.appendChild(s);
  }
 
  // Sparkles around the fairy
  const sparklePositions = [
    [10, 20], [90, 15], [15, 70], [85, 65], [50, 5], [30, 90], [70, 88], [5, 45], [95, 50]
  ];
  sparklePositions.forEach(([x, y], i) => {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.style.left = x + '%';
    sp.style.top = y + '%';
    sp.style.animationDelay = (i * 0.2) + 's';
    sky.appendChild(sp);
  });
 
  // Balloons
  const balloonColors = ['#F06292', '#BA68C8', '#4FC3F7', '#FFD54F', '#81C784'];
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = (10 + i * 16) + '%';
    b.style.background = balloonColors[i % balloonColors.length];
    b.style.animationDuration = (8 + Math.random() * 4) + 's';
    b.style.animationDelay = (Math.random() * 6) + 's';
    sky.appendChild(b);
  }
 
  // Confetti
  const confettiColors = ['#F06292', '#BA68C8', '#4FC3F7', '#FFD54F', '#81C784', '#FF8A65'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    c.style.animationDuration = (3 + Math.random() * 4) + 's';
    c.style.animationDelay = (Math.random() * 5) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    sky.appendChild(c);
  }
 
  // Cakes
  for (let i = 0; i < 3; i++) {
    const cake = document.createElement('div');
    cake.className = 'cake';
    cake.style.left = (20 + i * 30) + '%';
    cake.style.animationDuration = (10 + Math.random() * 4) + 's';
    cake.style.animationDelay = (Math.random() * 6) + 's';
    cake.innerHTML = `
      <div class="cake-flame"></div>
      <div class="cake-candle"></div>
      <div class="cake-top"></div>
      <div class="cake-bottom"></div>
    `;
    sky.appendChild(cake);
  }
 
  // Dragons — proper mythical dragon: segmented body, legs, horned head, snout, whiskers
  const dragonSVG = (i, main, accent) => `
    <svg viewBox="0 0 240 100">
      <defs>
        <linearGradient id="dg${i}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="${main}"/>
          <stop offset="1" stop-color="${accent}"/>
        </linearGradient>
      </defs>
      <path d="M8,62 C34,28 56,72 84,42 C110,14 130,64 152,36"
            stroke="url(#dg${i})" stroke-width="24" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="52" r="11" fill="${accent}" opacity="0.55"/>
      <circle cx="46" cy="42" r="11" fill="${accent}" opacity="0.55"/>
      <circle cx="72" cy="52" r="11" fill="${accent}" opacity="0.55"/>
      <circle cx="98" cy="36" r="11" fill="${accent}" opacity="0.55"/>
      <circle cx="124" cy="44" r="11" fill="${accent}" opacity="0.55"/>
      <path d="M40,50 L34,70 M34,70 l-6,4 M34,70 l4,6" stroke="${main}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M92,40 L86,62 M86,62 l-6,4 M86,62 l4,6" stroke="${main}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <polygon points="30,34 36,18 41,36" fill="${accent}"/>
      <polygon points="58,28 64,10 69,30" fill="${accent}"/>
      <polygon points="86,22 92,4 97,24" fill="${accent}"/>
      <polygon points="112,32 118,16 123,34" fill="${accent}"/>
      <g class="dragon-wiggle">
        <path d="M148,32 Q170,18 192,28 Q200,34 194,42 Q178,44 164,38 Q168,48 156,50 Q144,44 148,32 Z" fill="url(#dg${i})"/>
        <path d="M192,28 Q210,26 218,33 Q210,38 196,37 Z" fill="url(#dg${i})"/>
        <polygon points="212,32 216,34 212,36" fill="#FFF"/>
        <path d="M172,20 Q166,4 154,-4" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M182,18 Q182,0 174,-10" stroke="${accent}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M192,32 Q176,36 162,44" stroke="${accent}" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M194,38 Q180,44 168,52" stroke="${accent}" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="180" cy="27" r="3" fill="#1A1A1A"/>
      </g>
    </svg>
  `;
  const dragonColors = [['#E53935', '#FFD54F'], ['#43A047', '#FFEE58'], ['#FB8C00', '#FFF176']];
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'dragon';
    d.style.left = (8 + i * 32) + '%';
    d.style.top = (10 + i * 24) + '%';
    d.style.animationDuration = (18 + i * 3) + 's';
    d.style.animationDelay = (i * 1.5) + 's';
    const [main, accent] = dragonColors[i % dragonColors.length];
    d.innerHTML = dragonSVG(i, main, accent);
    sky.appendChild(d);
  }
 
  // Pink fairy dust trail — smooth continuous streak on canvas, following her actual position
  const fairyStage = document.querySelector('.fairy-stage');
  const wandTip = document.querySelector('.wand');
  const canvas = document.getElementById('dustCanvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() {
    canvas.width = sky.clientWidth;
    canvas.height = sky.clientHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
 
  function trailLoop() {
    // fade the existing trail gradually instead of clearing it instantly
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
 
    const rect = (wandTip || fairyStage).getBoundingClientRect();
    const skyRect = sky.getBoundingClientRect();
    const x = rect.left + rect.width / 2 - skyRect.left;
    const y = rect.top + rect.height * 0.7 - skyRect.top;
 
    const grad = ctx.createRadialGradient(x, y, 0, x, y, 22);
    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.35, 'rgba(255,105,180,0.9)');
    grad.addColorStop(1, 'rgba(255,105,180,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, 22, 0, Math.PI * 2);
    ctx.fill();
 
    // a couple of extra small sparkle flecks near the head for texture
    for (let k = 0; k < 2; k++) {
      const sx = x + (Math.random() * 30 - 15);
      const sy = y + (Math.random() * 30 - 15);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(sx, sy, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
 
    requestAnimationFrame(trailLoop);
  }
  requestAnimationFrame(trailLoop);
 
  // Randomized flight pattern — a new random loop path each time the page loads
  function buildRandomFlight() {
    const waypointCount = 6 + Math.floor(Math.random() * 3); // 6-8 waypoints
    const pts = [];
    for (let i = 0; i < waypointCount; i++) {
      pts.push({
        x: (Math.random() * 68 - 34).toFixed(1),
        y: (Math.random() * 52 - 26).toFixed(1),
        r: (Math.random() * 20 - 10).toFixed(1),
        s: (0.8 + Math.random() * 0.25).toFixed(2)
      });
    }
    let frames = `0% { transform: translate(-50%, -50%) translate(0,0) rotate(0deg) scale(1); }\n`;
    pts.forEach((p, i) => {
      const pct = Math.round(((i + 1) / (waypointCount + 1)) * 100);
      frames += `${pct}% { transform: translate(-50%, -50%) translate(${p.x}vw, ${p.y}vh) rotate(${p.r}deg) scale(${p.s}); }\n`;
    });
    frames += `100% { transform: translate(-50%, -50%) translate(0,0) rotate(0deg) scale(1); }`;
 
    const styleTag = document.createElement('style');
    styleTag.textContent = `@keyframes flyRandom { ${frames} }`;
    document.head.appendChild(styleTag);
 
    const duration = (13 + Math.random() * 7).toFixed(1);
    fairyStage.style.animation = `flyRandom ${duration}s ease-in-out infinite, bob 1.4s ease-in-out infinite`;
  }
  buildRandomFlight();
</script>
</body>
</html>
