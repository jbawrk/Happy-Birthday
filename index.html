<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Zyra!</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(180deg, #FFD1E8 0%, #FFE8CC 45%, #FFF6D9 100%);
    font-family: 'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif;
  }

  .sky {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* Twinkling stars */
  .star {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity: 0.8;
    animation: twinkle 2.2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Balloons */
  .balloon {
    position: absolute;
    bottom: -120px;
    width: 46px;
    height: 58px;
    border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
    animation: floatUp linear infinite;
    opacity: 0.9;
  }
  .balloon::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 60px;
    background: rgba(255,255,255,0.6);
    transform: translateX(-50%);
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(-60vh) translateX(20px) rotate(4deg); }
    100% { transform: translateY(-130vh) translateX(-10px) rotate(-4deg); }
  }

  .title-wrap {
    position: absolute;
    top: 6%;
    width: 100%;
    text-align: center;
    z-index: 5;
  }
  .title-wrap h1 {
    margin: 0;
    font-size: clamp(40px, 9vw, 84px);
    color: #C2185B;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(255,182,193,0.6);
    animation: pop 1.6s ease-in-out infinite;
  }
  .title-wrap h2 {
    margin: 8px 0 0;
    font-size: clamp(28px, 6vw, 52px);
    color: #7E57C2;
    text-shadow: 2px 2px 0 #fff;
  }
  @keyframes pop {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    50% { transform: scale(1.06) rotate(1deg); }
  }

  /* Fairy scene */
  .fairy-stage {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    animation: flyAround 14s ease-in-out infinite, bob 1.4s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes flyAround {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); }
    12%  { transform: translate(-50%, -50%) translate(-30vw, -12vh) rotate(-6deg) scale(0.92); }
    25%  { transform: translate(-50%, -50%) translate(-36vw, 9vh) rotate(-3deg) scale(0.88); }
    37%  { transform: translate(-50%, -50%) translate(-13vw, 24vh) rotate(5deg) scale(0.98); }
    50%  { transform: translate(-50%, -50%) translate(16vw, 22vh) rotate(8deg) scale(0.9); }
    62%  { transform: translate(-50%, -50%) translate(33vw, 5vh) rotate(5deg) scale(0.88); }
    75%  { transform: translate(-50%, -50%) translate(28vw, -20vh) rotate(-5deg) scale(0.95); }
    87%  { transform: translate(-50%, -50%) translate(5vw, -26vh) rotate(-3deg) scale(1); }
    100% { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); }
  }
  @keyframes bob {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -14px; }
  }

  .sparkle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #FFF176;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: sparkleFade 1.4s ease-in-out infinite;
  }
  @keyframes sparkleFade {
    0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
    50% { opacity: 1; transform: scale(1) rotate(90deg); }
  }

  .wing {
    position: absolute;
    width: 110px;
    height: 150px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(179,157,219,0.6) 65%, rgba(179,157,219,0.25));
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 60% 40% 60% 40%;
    top: 175px;
    z-index: 1;
    transform-origin: top center;
  }
  .wing-left {
    left: -95px;
    animation: flapLeft 0.5s ease-in-out infinite;
  }
  .wing-right {
    right: -95px;
    border-radius: 40% 60% 40% 60%;
    animation: flapRight 0.5s ease-in-out infinite;
  }
  @keyframes flapLeft {
    0%, 100% { transform: rotate(-15deg) scaleX(1); }
    50% { transform: rotate(5deg) scaleX(0.85); }
  }
  @keyframes flapRight {
    0%, 100% { transform: rotate(15deg) scaleX(1); }
    50% { transform: rotate(-5deg) scaleX(0.85); }
  }

  .body-small {
    position: absolute;
    top: 218px;
    left: 50%;
    transform: translateX(-50%);
    width: 92px;
    height: 108px;
    background: linear-gradient(180deg, #F0177E, #D6006B);
    border: 3px solid #1A1A1A;
    border-radius: 50% 50% 40% 40%;
    box-shadow: inset -8px -6px 14px rgba(0,0,0,0.1);
    z-index: 2;
  }
  .body-small::before,
  .body-small::after {
    content: '';
    position: absolute;
    bottom: -10px;
    width: 24px;
    height: 40px;
    background: #E0A470;
    border-radius: 40%;
  }
  .body-small::before { left: 12px; transform: rotate(8deg); }
  .body-small::after { right: 12px; transform: rotate(-8deg); }

  .arm {
    position: absolute;
    top: 230px;
    width: 18px;
    height: 52px;
    background: #E0A470;
    border-radius: 10px;
    animation: wave 1.2s ease-in-out infinite;
    transform-origin: top center;
  }
  .arm-left { left: 50%; margin-left: -70px; animation-delay: 0.1s; }
  .arm-right { left: 50%; margin-left: 52px; }
  @keyframes wave {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(-25deg); }
  }

  .wand {
    position: absolute;
    top: 218px;
    left: 50%;
    margin-left: 62px;
    width: 5px;
    height: 60px;
    background: #FFD54F;
    border-radius: 4px;
    transform: rotate(-20deg);
    transform-origin: bottom center;
    animation: wandWave 1.2s ease-in-out infinite;
  }
  .wand::before {
    content: '';
    position: absolute;
    top: -18px;
    left: -12px;
    width: 28px;
    height: 28px;
    background: #FFF176;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  @keyframes wandWave {
    0%, 100% { transform: rotate(-20deg); }
    50% { transform: rotate(-55deg); }
  }

  .head-photo {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 220px;
    border-radius: 50%;
    overflow: hidden;
    background: transparent;
    z-index: 3;
    border: 4px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }
  .head-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hair, .hair-side-l, .hair-side-r {
    display: none;
  }

  .face {
    display: none;
  }

  .crown {
    position: absolute;
    top: -48px;
    left: 50%;
    transform: translateX(-50%);
    width: 88px;
    height: 38px;
    z-index: 4;
  }
  .crown::before {
    content: '';
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 24px;
    background: #FFD54F;
    clip-path: polygon(0% 100%, 0% 40%, 20% 100%, 30% 20%, 50% 100%, 70% 20%, 80% 100%, 100% 40%, 100% 100%);
  }
  .crown-gem {
    position: absolute;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #E91E63;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }

  .tutu {
    position: absolute;
    top: 258px;
    left: 50%;
    transform: translateX(-50%);
    width: 132px;
    height: 44px;
    background: repeating-linear-gradient(90deg, #F0177E, #F0177E 11px, #1A1A1A 11px, #1A1A1A 15px);
    border-radius: 50% 50% 60% 60%;
    z-index: 2;
    animation: tutuSway 1.6s ease-in-out infinite;
    transform-origin: top center;
  }
  @keyframes tutuSway {
    0%, 100% { transform: translateX(-50%) rotate(-3deg); }
    50% { transform: translateX(-50%) rotate(3deg); }
  }

  .subtext {
    display: none;
  }

  .confetti {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    animation: confettiFall linear infinite;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(540deg); opacity: 0.9; }
  }

  /* Age badge */
  .age-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFF3B0, #FFD54F 55%, #FFB300 100%);
    box-shadow: 0 0 0 6px rgba(255,213,79,0.25), 0 0 30px rgba(255,179,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    animation: badgePulse 2.4s ease-in-out infinite;
  }
  .age-badge span {
    font-size: 64px;
    font-weight: bold;
    color: #C2185B;
    text-shadow: 2px 2px 0 #fff;
  }
  @keyframes badgePulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.06); }
  }

  /* Cakes */
  .cake {
    position: absolute;
    bottom: -140px;
    width: 46px;
    animation: floatUp linear infinite;
    opacity: 0.95;
  }
  .cake-candle {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 12px;
    background: #FFD54F;
  }
  .cake-flame {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 9px;
    background: #FF8A65;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.6s ease-in-out infinite;
  }
  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(0.8) rotate(4deg); }
  }
  .cake-top {
    width: 30px;
    height: 16px;
    margin: 0 auto;
    background: #FFF6E0;
    border: 2px solid #1A1A1A;
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }
  .cake-bottom {
    width: 46px;
    height: 20px;
    background: #F0177E;
    border: 2px solid #1A1A1A;
    border-radius: 4px;
  }

  /* Dragons */
  .dragon {
    position: absolute;
    width: 190px;
    height: 70px;
    animation: dragonDrift linear infinite;
  }
  .dragon svg {
    width: 100%;
    height: 100%;
  }
  .dragon-wiggle {
    animation: dragonWiggle 1.4s ease-in-out infinite;
    transform-origin: 170px 30px;
  }
  @keyframes dragonWiggle {
    0%, 100% { transform: skewY(-3deg); }
    50% { transform: skewY(3deg); }
  }
  @keyframes dragonDrift {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(-22vw, -14vh) rotate(4deg); }
    50%  { transform: translate(-42vw, 8vh) rotate(-4deg); }
    75%  { transform: translate(-18vw, 20vh) rotate(3deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* Pink fairy dust trail */
  .fairy-dust {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFFFFF 0%, #FFD1E8 30%, #F06292 65%, transparent 100%);
    box-shadow: 0 0 12px 4px rgba(240, 98, 146, 0.8), 0 0 4px 2px rgba(255, 255, 255, 0.9);
    pointer-events: none;
    z-index: 6;
    animation: dustFade 1.4s ease-out forwards;
  }
  @keyframes dustFade {
    0% { opacity: 1; transform: scale(1.3) translateY(0); }
    60% { opacity: 0.85; transform: scale(1) translateY(12px); }
    100% { opacity: 0; transform: scale(0.15) translateY(30px); }
  }
</style>
</head>
<body>
<div class="sky" id="sky">

  <div class="title-wrap">
    <h1>Happy Birthday</h1>
    <h2>Zyra!</h2>
  </div>

  <div class="age-badge"><span>27</span></div>

  <div class="fairy-stage">
    <div class="crown">
      <div class="crown-gem"></div>
    </div>
    <div class="wing wing-left"></div>
    <div class="wing wing-right"></div>
    <div class="head-photo">
      <img src="zyra-head.png" alt="Zyra" onerror="this.style.display='none'; this.parentElement.style.background='rgba(255,255,255,0.15)';">
    </div>
    <div class="face"></div>
    <div class="body-small"></div>
    <div class="tutu"></div>
    <div class="arm arm-left"></div>
    <div class="arm arm-right"></div>
    <div class="wand"></div>
  </div>
  </div>

<script>
  const sky = document.getElementById('sky');

  // Stars
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 60 + '%';
    s.style.animationDelay = Math.random() * 2 + 's';
    sky.appendChild(s);
  }

  // Sparkles around the fairy
  const sparklePositions = [
    [10, 20], [90, 15], [15, 70], [85, 65], [50, 5], [30, 90], [70, 88], [5, 45], [95, 50]
  ];
  sparklePositions.forEach(([x, y], i) => {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.style.left = x + '%';
    sp.style.top = y + '%';
    sp.style.animationDelay = (i * 0.2) + 's';
    sky.appendChild(sp);
  });

  // Balloons
  const balloonColors = ['#F06292', '#BA68C8', '#4FC3F7', '#FFD54F', '#81C784'];
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = (10 + i * 16) + '%';
    b.style.background = balloonColors[i % balloonColors.length];
    b.style.animationDuration = (8 + Math.random() * 4) + 's';
    b.style.animationDelay = (Math.random() * 6) + 's';
    sky.appendChild(b);
  }

  // Confetti
  const confettiColors = ['#F06292', '#BA68C8', '#4FC3F7', '#FFD54F', '#81C784', '#FF8A65'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + '%';
    c.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    c.style.animationDuration = (3 + Math.random() * 4) + 's';
    c.style.animationDelay = (Math.random() * 5) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    sky.appendChild(c);
  }

  // Cakes
  for (let i = 0; i < 3; i++) {
    const cake = document.createElement('div');
    cake.className = 'cake';
    cake.style.left = (20 + i * 30) + '%';
    cake.style.animationDuration = (10 + Math.random() * 4) + 's';
    cake.style.animationDelay = (Math.random() * 6) + 's';
    cake.innerHTML = `
      <div class="cake-flame"></div>
      <div class="cake-candle"></div>
      <div class="cake-top"></div>
      <div class="cake-bottom"></div>
    `;
    sky.appendChild(cake);
  }

  // Dragons (Chinese dragon style — serpentine body, mane, antlers, whiskers)
  const dragonSVG = (main, accent) => `
    <svg viewBox="0 0 190 70">
      <path d="M5,50 C30,20 45,60 70,38 C95,15 110,58 135,32 C150,18 158,25 165,30"
            stroke="${main}" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M5,50 C30,20 45,60 70,38 C95,15 110,58 135,32 C150,18 158,25 165,30"
            stroke="${accent}" stroke-width="16" fill="none" stroke-linecap="round"
            stroke-dasharray="2 12" opacity="0.55"/>
      <polygon points="20,32 26,18 32,34" fill="${accent}"/>
      <polygon points="45,50 51,36 57,52" fill="${accent}"/>
      <polygon points="72,26 78,12 84,28" fill="${accent}"/>
      <polygon points="100,44 106,30 112,46" fill="${accent}"/>
      <polygon points="128,22 134,10 139,24" fill="${accent}"/>
      <g class="dragon-wiggle">
        <ellipse cx="172" cy="28" rx="18" ry="15" fill="${main}"/>
        <path d="M160,16 Q156,2 148,-2" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M170,12 Q170,-2 166,-8" stroke="${accent}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M162,32 Q146,30 136,36" stroke="${accent}" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M163,38 Q150,42 142,50" stroke="${accent}" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="180" cy="24" r="2.4" fill="#1A1A1A"/>
        <ellipse cx="187" cy="30" rx="6" ry="4" fill="${main}"/>
      </g>
    </svg>
  `;
  const dragonColors = [['#E53935', '#FFD54F'], ['#43A047', '#FFEE58'], ['#FB8C00', '#FFF176']];
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'dragon';
    d.style.left = (10 + i * 30) + '%';
    d.style.top = (12 + i * 22) + '%';
    d.style.animationDuration = (18 + i * 3) + 's';
    d.style.animationDelay = (i * 1.5) + 's';
    const [main, accent] = dragonColors[i % dragonColors.length];
    d.innerHTML = dragonSVG(main, accent);
    sky.appendChild(d);
  }

  // Pink fairy dust trail — follows the fairy's actual on-screen position
  const fairyStage = document.querySelector('.fairy-stage');
  const wandTip = document.querySelector('.wand');
  const dustColors = ['#FF80AB', '#F06292', '#FFC1E3', '#FF4FA0'];
  function spawnDust() {
    const rect = (wandTip || fairyStage).getBoundingClientRect();
    const skyRect = sky.getBoundingClientRect();
    const baseX = rect.left + rect.width / 2 - skyRect.left;
    const baseY = rect.top + rect.height * 0.7 - skyRect.top;
    const count = 2 + Math.floor(Math.random() * 2);
    for (let n = 0; n < count; n++) {
      const x = baseX + (Math.random() * 44 - 22);
      const y = baseY + (Math.random() * 44 - 22);
      const dust = document.createElement('div');
      dust.className = 'fairy-dust';
      dust.style.left = x + 'px';
      dust.style.top = y + 'px';
      const size = 8 + Math.random() * 10;
      dust.style.width = size + 'px';
      dust.style.height = size + 'px';
      dust.style.background = `radial-gradient(circle, #FFFFFF 0%, ${dustColors[n % dustColors.length]} 45%, transparent 100%)`;
      dust.style.animationDuration = (1.1 + Math.random() * 0.6) + 's';
      sky.appendChild(dust);
      setTimeout(() => dust.remove(), 1700);
    }
  }
  setInterval(spawnDust, 45);
</script>
</body>
</html>
